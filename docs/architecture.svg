<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" font-family="ui-monospace,Consolas,monospace">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="920" height="430" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>

  <!-- incoming event -->
  <rect x="24" y="180" width="130" height="70" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="89" y="205" text-anchor="middle" font-size="13" font-weight="600" fill="#0969da">Event</text>
  <text x="89" y="224" text-anchor="middle" font-size="11" fill="#57606a">add / cancel / modify</text>
  <text x="89" y="238" text-anchor="middle" font-size="11" fill="#57606a">(id, side, price, qty)</text>

  <!-- index map -->
  <rect x="230" y="40" width="200" height="80" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
  <text x="330" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#9a6700">index_: id &#8594; Node*</text>
  <text x="330" y="80" text-anchor="middle" font-size="11" fill="#57606a">flat hash map — O(1) cancel</text>
  <text x="330" y="95" text-anchor="middle" font-size="11" fill="#57606a">find, unlink, release</text>

  <!-- lvl_at / flat levels -->
  <rect x="230" y="290" width="200" height="90" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <text x="330" y="312" text-anchor="middle" font-size="13" font-weight="600" fill="#cf222e">lvl_at: price &#8722; LO</text>
  <text x="330" y="330" text-anchor="middle" font-size="11" fill="#57606a">flat arrays — bids_lv_ / asks_lv_</text>
  <text x="330" y="345" text-anchor="middle" font-size="11" fill="#57606a">price &#8594; Level in one subtraction</text>
  <text x="330" y="362" text-anchor="middle" font-size="11" fill="#57606a">O(1), no tree descent</text>

  <!-- occupancy bitmap -->
  <rect x="230" y="150" width="200" height="90" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="330" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#1a7f37">occupancy bitmap</text>
  <text x="330" y="190" text-anchor="middle" font-size="11" fill="#57606a">1 bit per price — 64 prices/word</text>
  <text x="330" y="205" text-anchor="middle" font-size="11" fill="#57606a">bit[i] == (level i nonempty)</text>
  <text x="330" y="222" text-anchor="middle" font-size="11" fill="#57606a">tzcnt / lzcnt &#8594; best, next level</text>

  <!-- pool -->
  <rect x="520" y="40" width="370" height="80" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="705" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#24292f">pool_ + free_</text>
  <text x="705" y="78" text-anchor="middle" font-size="11" fill="#57606a">one array of Nodes at ctor — zero hot-path malloc</text>
  <text x="705" y="95" text-anchor="middle" font-size="11" fill="#57606a">stable addresses; alloc = free-stack pop; throws if exhausted</text>

  <!-- level + intrusive FIFO -->
  <rect x="520" y="290" width="370" height="90" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="705" y="310" text-anchor="middle" font-size="13" font-weight="600" fill="#24292f">Level { head, tail } &#8594; intrusive FIFO</text>
  <text x="705" y="328" text-anchor="middle" font-size="11" fill="#57606a">orders link to each other — FIFO within a price</text>
  <text x="705" y="344" text-anchor="middle" font-size="11" fill="#57606a">unlink = 4 pointer writes; n&#8594;lvl backpointer</text>
  <text x="705" y="362" text-anchor="middle" font-size="11" fill="#57606a">chase bounded at one hop (head/tail only)</text>

  <!-- trades out -->
  <rect x="660" y="170" width="150" height="60" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="735" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#0969da">trades</text>
  <text x="735" y="214" text-anchor="middle" font-size="11" fill="#57606a">templated callback — no std::function</text>

  <!-- arrows -->
  <line x1="154" y1="200" x2="230" y2="195" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="154" y1="220" x2="230" y2="80"  stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="154" y1="230" x2="230" y2="330" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>

  <line x1="430" y1="80"  x2="520" y2="80"  stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="430" y1="330" x2="520" y2="330" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="430" y1="195" x2="520" y2="195" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <line x1="520" y1="200" x2="660" y2="200" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="475" y="190" text-anchor="middle" font-size="10" fill="#57606a">which levels are live?</text>
  <text x="590" y="190" text-anchor="middle" font-size="10" fill="#57606a"></text>
  <text x="590" y="250" text-anchor="middle" font-size="10" fill="#57606a"></text>
</svg>
